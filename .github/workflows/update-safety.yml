name: Update safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: updater-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  updater-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify update policy
        run: python3 tools/check_updates.py

      - name: Application unit tests
        run: python3 -m unittest discover -s tests -v
